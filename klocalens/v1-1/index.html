    /* hide the "지금 {diet}에 좋은 재료부터" hero header (user request) */
    (function(){
      function hide(){
        document.querySelectorAll('.section-head').forEach(function(h){
          var t = h.querySelector('.section-title');
          if(t && t.textContent.trim().indexOf('지금') === 0) h.style.display = 'none';
        });
      }
      hide();
      new MutationObserver(hide).observe(document.body, {childList:true, subtree:true});
    })();
